name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/pisentry/pisentry

jobs:
  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # keyless signing: Fulcio certificate from the job's OIDC token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false
      # The tag name reaches a shell below. Only a release tag (v1.2.3) or a
      # release candidate (v1.2.3-rc.1) gets that far.
      - name: Check tag
        env:
          TAG: ${{ github.ref_name }}
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]] || { echo "not a release tag: $TAG"; exit 1; }'
      - run: go test ./...
      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
        run: make dist VERSION="$VERSION"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      # Keyless: the certificate names this workflow and tag, the signature is
      # recorded in the Sigstore transparency log, no long-lived key exists.
      - name: Sign SHA256SUMS
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '/^## \[/{p = index($0, "[" v "]") > 0} p' CHANGELOG.md > notes.md
          test -s notes.md || echo "pisentry ${GITHUB_REF_NAME}" > notes.md
      # A release candidate is a pre-release, so it never becomes "Latest".
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=()
          [[ "$GITHUB_REF_NAME" == *-rc.* ]] && pre=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* "${pre[@]}" \
            --verify-tag --title "pisentry $GITHUB_REF_NAME" --notes-file notes.md

  # Signs the rule packs as a bundle for `pisentry update-patterns` and
  # attaches it to the release. The Ed25519 key is a secret of the
  # rules-signing environment, which has a required reviewer: nothing is
  # signed until a maintainer approves this job. One-time setup and key
  # rotation: docs/rule-schema.md ("Signed bundles"). Re-running this job
  # later signs the same files with a newer version and a fresh expiry.
  # Release candidates get no bundle: update-patterns reads the latest final
  # release, so an rc bundle would never be fetched.
  rules-bundle:
    needs: binaries # the release must exist to attach to
    if: ${{ !contains(github.ref_name, '-rc.') }}
    runs-on: ubuntu-latest
    environment: rules-signing
    permissions:
      contents: write # attach the bundle to the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false
      # The version is the signing time, so it only goes up, also on a re-run.
      # Packs written for this release may use anything this release added,
      # so older agents are told to upgrade first.
      - name: Sign bundle
        id: sign
        env:
          PISENTRY_BUNDLE_KEY: ${{ secrets.RULES_SIGNING_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          packs=(deploy/rules/packs/*.json)
          if [ ${#packs[@]} -eq 0 ]; then
            echo "::notice::no rule packs in deploy/rules/packs, nothing to sign"
            exit 0
          fi
          go run ./cmd/pisentry-bundle sign -version "$(date -u +%Y%m%d%H%M)" -min-agent "$TAG" -out bundle "${packs[@]}"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      # Fails if the signing key is not one of the keys embedded in this
      # release, so a bundle no agent would accept is never published.
      - name: Verify with the embedded keys
        if: steps.sign.outputs.signed == 'true'
        run: go run ./cmd/pisentry check -rules bundle
      - name: Attach to release
        if: steps.sign.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" bundle/* --clobber

  image:
    needs: binaries # no image unless tests pass
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # keyless signing: Fulcio certificate from the job's OIDC token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No QEMU: the Go stage cross-compiles on the build platform and the
      # distroless stage only COPYs, so nothing runs under emulation.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64,linux/arm/v7,linux/amd64
          build-args: VERSION=${{ github.ref_name }}
          push: true
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          # :latest moves only on a final release, never on a release candidate.
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ !contains(github.ref_name, '-rc.') && format('{0}:latest', env.IMAGE) || '' }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      # Sign the manifest list by digest, never by tag: a tag can be moved,
      # a digest cannot. The signature is stored next to the image in ghcr.io.
      - name: Sign image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Digest for pinning
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo '### Image'
            echo '```'
            echo "${IMAGE}:${GITHUB_REF_NAME}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
